[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-model-chatbot"
version = "0.1.0"
description = "A local multi-model chatbot with a browser UI, CLI, and FastAPI backend"
requires-python = ">=3.10"

[project.scripts]
chatbot = "cli.main:app"

[tool.setuptools]
packages = ["app", "app.providers", "cli"]
